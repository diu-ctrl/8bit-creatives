<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <meta name="msapplication-TileColor" content="#0A0A0A">
  <meta name="msapplication-config" content="/favicon/browserconfig.xml">
<title>8Bit Game Characters — Enhanced SVG Art</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; min-height: 100vh; background: #0A0A0A;
    font-family: 'Geist', sans-serif; overflow-x: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .characters-row {
    display: flex; flex-wrap: wrap; justify-content: center;
    align-items: flex-end; gap: 20px; max-width: 1800px; width: 100%;
  }
  .character-slot {
    width: 120px; height: 200px;
    display: flex; align-items: flex-end; justify-content: center;
    position: relative; cursor: pointer;
    transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1), filter 300ms ease;
    opacity: 0; animation: char-enter 600ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
  }
  .character-slot:hover {
    transform: scale(1.15) translateY(-8px);
    filter: drop-shadow(0 8px 24px rgba(255, 89, 49, 0.4)); z-index: 10;
  }
  .character-slot svg { width: 100%; height: 100%; overflow: visible; }
  .character-label {
    position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%);
    font-family: 'Geist', sans-serif; font-size: 9px; font-weight: 500;
    color: #FF5931; text-transform: uppercase; letter-spacing: 0.15em;
    opacity: 0; transition: opacity 200ms ease; white-space: nowrap; pointer-events: none;
  }
  .character-slot:hover .character-label { opacity: 1; }
  @keyframes char-enter {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .character-slot:nth-child(n) { animation-delay: calc(var(--i, 0) * 70ms); }
  .character-slot:nth-child(1) { --i: 0; }
  .character-slot:nth-child(2) { --i: 1; }
  .character-slot:nth-child(3) { --i: 2; }
  .character-slot:nth-child(4) { --i: 3; }
  .character-slot:nth-child(5) { --i: 4; }
  .character-slot:nth-child(6) { --i: 5; }
  .character-slot:nth-child(7) { --i: 6; }
  .character-slot:nth-child(8) { --i: 7; }
  .character-slot:nth-child(9) { --i: 8; }
  .character-slot:nth-child(10) { --i: 9; }
  .character-slot:nth-child(11) { --i: 10; }
  .character-slot:nth-child(12) { --i: 11; }
  @media (max-width: 1024px) {
    .character-slot { width: 100px; height: 160px; }
    .characters-row { gap: 16px; }
  }
  @media (max-width: 768px) {
    .character-slot { width: 80px; height: 130px; }
    .characters-row { gap: 12px; }
  }
  @media (max-width: 480px) {
    .character-slot { width: 65px; height: 105px; }
    .characters-row { gap: 8px; }
  }
</style>
</head>
<body>
