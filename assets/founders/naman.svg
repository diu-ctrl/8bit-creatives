<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="none" stroke="#2a2a2a" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <rect width="600" height="600" fill="url(#grid)" opacity="0.6" />
  
  <!-- Corner Pixel Accents -->
  <rect x="20" y="20" width="8" height="8" fill="#FF4D00" />
  <rect x="32" y="20" width="8" height="8" fill="#FF4D00" />
  <rect x="20" y="32" width="8" height="8" fill="#FF4D00" />
  
  <rect x="572" y="20" width="8" height="8" fill="#FF4D00" />
  <rect x="560" y="20" width="8" height="8" fill="#FF4D00" />
  <rect x="572" y="32" width="8" height="8" fill="#FF4D00" />
  
  <!-- Center Monogram Box -->
  <rect x="220" y="160" width="160" height="160" fill="#181818" stroke="#FF4D00" stroke-width="2" />
  <text x="300" y="255" font-family="'Geist', sans-serif" font-size="44" font-weight="900" fill="#FF4D00" text-anchor="middle">NAM</text>
  
  <!-- Labels -->
  <text x="300" y="380" font-family="'Geist', sans-serif" font-size="28" font-weight="700" fill="#F7F5F1" text-anchor="middle">NAMAN MATHUR</text>
  <text x="300" y="415" font-family="'Geist', sans-serif" font-size="16" font-weight="500" fill="#A8A399" text-anchor="middle">Mortal · Co-Founder</text>
  
  <!-- Badge -->
  <rect x="200" y="460" width="200" height="32" fill="#FF4D00" rx="2" />
  <text x="300" y="481" font-family="'Geist', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">CREATOR FIGUREHEAD</text>
</svg>