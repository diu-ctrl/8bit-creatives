<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>404 — Page not found · 8Bit Creatives</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <link rel="canonical" href="https://8bit-creatives.vercel.app/404">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      background: #0A0A0A;
      overflow: hidden;
      font-family: 'Geist', system-ui, sans-serif;
      color: #FFFFFF;
    }
    body {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* ---------- Top-left: 8Bit logo mark + back-to-home capsule ---------- */
    .top-left {
      position: absolute;
      top: 40px;
      left: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    .logo-mark {
      width: 28px;
      height: 28px;
      background: #FF5931;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.04em;
    }
    .wordmark {
      font-family: 'Geist', sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      margin-right: 8px;
    }
    .divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
    }
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 100px;
      background: transparent;
      color: #FFFFFF;
      font-family: 'Geist', sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: -0.005em;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 200ms ease-out, border-color 200ms ease-out;
    }
    .back-home__arrow {
      display: inline-block;
      font-family: 'Geist', sans-serif;
      font-weight: 400;
      font-size: 14px;
      line-height: 1;
      transform: translateY(-1px);
    }
    .back-home:hover {
      background: #FFFFFF;
      color: #0A0A0A;
      border-color: #FFFFFF;
    }
    @media (hover: none) and (pointer: coarse) {
      .back-home:hover { background: transparent; color: #FFFFFF; border-color: rgba(255,255,255,0.20); }
    }

    /* ---------- Center: giant 404 + caption ---------- */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .four-oh-four {
      font-family: 'Geist', sans-serif;
      font-weight: 100;          /* Thin — matches the editorial tone */
      font-size: 320px;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: #FFFFFF;
      margin: 0;
    }
    .caption {
      font-family: 'Geist', sans-serif;
      font-weight: 300;
      font-style: italic;
      font-size: 22px;
      line-height: 1.4;
      letter-spacing: -0.005em;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 32px;
    }

    /* ---------- Bottom-right: tiny page label ---------- */
    .bottom-right {
      position: absolute;
      bottom: 40px;
      right: 56px;
      font-family: 'Geist', sans-serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="top-left">
    <div class="logo-mark">8</div>
    <span class="wordmark">8Bit&nbsp;Creatives</span>
    <div class="divider"></div>
    <a href="index.html" class="back-home" aria-label="Back to home">
      <span class="back-home__arrow">←</span>
      <span>back to home</span>
    </a>
  </div>

  <div class="center">
    <h1 class="four-oh-four">404</h1>
    <p class="caption">Page not found</p>
  </div>

  <div class="bottom-right">404 · 8Bit Creatives</div>
</body>
</html>
